# Legacy: legacy/KYRLOCS.C:317 (believ); legacy/KYRROUS.C:1361-1372 (believ)
id: 257
name: believ
allow_normalized_retry: false
spoiler_summary: "Chamber of the Bard where belief in magic tests readiness for level 21."
spoiler_interaction: "Say 'believe in magic' to attempt the level 21 ascension."
legacy_ref: "legacy/KYRROUS.C:1361-1372"
triggers:
  - verbs: [believe]
    # Legacy checks raw tokens margv[1]=="in" and margv[2]=="magic".
    # Source: legacy/KYRROUS.C:1361-1365.
    arg_sequence: [in, magic]
    actions:
      # Legacy believ() calls chklvl(21), which checks KYRKEY/NORMAL module
      # entitlement and the requested target level before msgutl2()+glvutl().
      # Source: legacy/KYRROUS.C:1361-1367, 1436-1456.
      - type: level_gate
        target_level: 21
        level_up: true
        on_success:
          - type: message
            message_id: LEVL21
            broadcast_message_id: LVL9M1
            broadcast_format: [player_altnam]
        on_too_high:
          - type: message
            message_id: LVLM00
            broadcast_message_id: LVLM01
            broadcast_format: [player_altnam]
        on_too_low:
          - type: message
            message_id: LVLM02
            broadcast_message_id: LVLM03
            broadcast_format: [player_altnam]
