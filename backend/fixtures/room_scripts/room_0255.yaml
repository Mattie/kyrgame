# Legacy: legacy/KYRLOCS.C:315 (oflove); legacy/KYRROUS.C:1347-1358 (oflove)
id: 255
name: oflove
allow_normalized_retry: false
spoiler_summary: "Goddess of Love altar where an offering of love tests readiness for level 22."
spoiler_interaction: "Offer love with love as the first or second word after offer to attempt the level 22 ascension."
legacy_ref: "legacy/KYRROUS.C:1347-1358"
triggers:
  - verbs: [offer]
    # Legacy checks raw margv[1]/margv[2] for "love" without gi_bagthe/bagprep.
    # Source: legacy/KYRROUS.C:1347-1352.
    arg_matches:
      - index: 0
        value: love
    actions:
      # Legacy oflove() calls chklvl(22), which checks KYRKEY/NORMAL module
      # entitlement and the requested target level before msgutl2()+glvutl().
      # Source: legacy/KYRROUS.C:1347-1353, 1436-1456.
      - type: level_gate
        target_level: 22
        level_up: true
        on_success:
          - type: message
            message_id: LEVL22
            broadcast_message_id: LVL9M1
            broadcast_format: [player_altnam]
        on_too_high:
          - type: message
            message_id: LVLM00
            broadcast_message_id: LVLM01
            broadcast_format: [player_altnam]
        on_too_low:
          - type: message
            message_id: LVLM02
            broadcast_message_id: LVLM03
            broadcast_format: [player_altnam]
  - verbs: [offer]
    # Legacy also accepts "love" as the second post-verb token.
    # Source: legacy/KYRROUS.C:1347-1352.
    arg_matches:
      - index: 1
        value: love
    actions:
      # Legacy oflove() calls chklvl(22), which checks KYRKEY/NORMAL module
      # entitlement and the requested target level before msgutl2()+glvutl().
      # Source: legacy/KYRROUS.C:1347-1353, 1436-1456.
      - type: level_gate
        target_level: 22
        level_up: true
        on_success:
          - type: message
            message_id: LEVL22
            broadcast_message_id: LVL9M1
            broadcast_format: [player_altnam]
        on_too_high:
          - type: message
            message_id: LVLM00
            broadcast_message_id: LVLM01
            broadcast_format: [player_altnam]
        on_too_low:
          - type: message
            message_id: LVLM02
            broadcast_message_id: LVLM03
            broadcast_format: [player_altnam]
