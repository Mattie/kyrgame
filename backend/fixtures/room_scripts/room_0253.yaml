# Legacy: legacy/KYRLOCS.C:313 (forgtr); legacy/KYRROUS.C:1334-1344 (forgtr)
id: 253
name: forgtr
spoiler_summary: "Hall of Forgetfulness where forgetting tests readiness for level 20."
spoiler_interaction: "Say 'forget' to attempt the level 20 ascension."
legacy_ref: "legacy/KYRROUS.C:1334-1344"
triggers:
  - verbs: [forget]
    actions:
      # Legacy forgtr() calls chklvl(20), which checks KYRKEY/NORMAL module
      # entitlement and the requested target level before msgutl2()+glvutl().
      # Source: legacy/KYRROUS.C:1334-1339, 1436-1456.
      - type: level_gate
        target_level: 20
        level_up: true
        on_success:
          - type: message
            message_id: LEVL20
            broadcast_message_id: LVL9M1
            broadcast_format: [player_altnam]
        on_too_high:
          - type: message
            message_id: LVLM00
            broadcast_message_id: LVLM01
            broadcast_format: [player_altnam]
        on_too_low:
          - type: message
            message_id: LVLM02
            broadcast_message_id: LVLM03
            broadcast_format: [player_altnam]
