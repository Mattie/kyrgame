services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kyrgame}
      POSTGRES_USER: ${POSTGRES_USER:-kyrgame}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/self-host/.env.selfhost.local}
    volumes:
      - kyrgame_selfhost_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: uvicorn kyrgame.webapp:create_app --factory --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kyrgame}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kyrgame}
      KYRGAME_ADMIN_TOKEN: ${KYRGAME_ADMIN_TOKEN:-}
      KYRGAME_ADMIN_ALLOWLIST_PATH: ${KYRGAME_ADMIN_ALLOWLIST_PATH:-/config/admin-allowlist.yaml}
      KYRGAME_CORS_ORIGINS: ${KYRGAME_CORS_ORIGINS:?set KYRGAME_CORS_ORIGINS in deploy/self-host/.env.selfhost.local}
      KYRGAME_RESET_ON_BOOT: ${KYRGAME_RESET_ON_BOOT:-0}
      KYRGAME_SEED_IF_EMPTY: ${KYRGAME_SEED_IF_EMPTY:-1}
      KYRGAME_FORCE_HONOR_MODE: ${KYRGAME_FORCE_HONOR_MODE:-0}
      KYRGAME_RUN_MIGRATIONS: ${KYRGAME_RUN_MIGRATIONS:-1}
      KYRGAME_TELEMETRY_DIR: ${KYRGAME_TELEMETRY_DIR:-/data/telemetry}
      KYRGAME_TRUST_PROXY_HEADERS: ${KYRGAME_TRUST_PROXY_HEADERS:-1}
      KYRGAME_DB_CONNECT_ATTEMPTS: ${KYRGAME_DB_CONNECT_ATTEMPTS:-30}
      KYRGAME_DB_CONNECT_RETRY_SECONDS: ${KYRGAME_DB_CONNECT_RETRY_SECONDS:-1}
    volumes:
      - ../../selfhost/config:/config:ro
      - kyrgame_selfhost_backend_data:/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: deploy/self-host/web.Dockerfile
    restart: unless-stopped
    environment:
      KYRGAME_PUBLIC_HOST: ${KYRGAME_PUBLIC_HOST:?set KYRGAME_PUBLIC_HOST in deploy/self-host/.env.selfhost.local}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_config:
  caddy_data:
  kyrgame_selfhost_backend_data:
  kyrgame_selfhost_postgres_data:
